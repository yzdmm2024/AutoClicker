name: Build AutoClicker dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        continue-on-error: true
        run: brew install ldid || HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install ldid || true

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos clang --version
          xcodebuild -sdk iphoneos -version 2>/dev/null | head -3 || true

      - name: Compile & link dylib
        run: |
          set -e
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -I. \
            -dynamiclib \
            -Wl,-undefined,dynamic_lookup \
            -Wno-arc-performSelector-leaks \
            -Wno-incompatible-pointer-types \
            -Wno-deprecated-declarations \
            -framework UIKit -framework Foundation -framework IOKit \
            Tweak.m -o AutoClicker.dylib
          echo "=== built ==="
          ls -la AutoClicker.dylib
          file AutoClicker.dylib

      - name: Sign with ldid
        continue-on-error: true
        run: |
          # 先彻底剥离已有签名(ldid 自带的 -r 比 codesign 更干净, 避免新版 ldid 重签时断言崩溃)
          ldid -r AutoClicker.dylib 2>/dev/null || true
          codesign --remove-signature AutoClicker.dylib 2>/dev/null || true
          # 策略1: -S 紧贴文件名
          if ldid -Sentitlements.xml AutoClicker.dylib 2>&1; then
            echo "=== SIGNED via -Sentitlements.xml ==="
            ldid -l AutoClicker.dylib || true
            exit 0
          fi
          # 策略2: 仅加 iOS 平台签名(不要 entitlements)
          echo "---- 重试: 仅平台签名 -S ----"
          if ldid -S AutoClicker.dylib 2>&1; then
            echo "=== SIGNED via -S (no entitlements) ==="
            exit 0
          fi
          echo "WARN: ldid 签名失败, 产物保持未签名(交由 TrollFools 注入时重签)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker.dylib
          path: |
            AutoClicker.dylib
            AutoClicker.plist
